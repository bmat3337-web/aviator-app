name: Aviator Foundation CI

on:
  push:
    branches: ["aviator/foundation-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: npm run build
      - name: Foundation acceptance gate
        run: npx tsx src/application/foundationAcceptance.test.ts
