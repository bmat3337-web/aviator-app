<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aviator Analysis</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:dark;--bg:#101114;--card:#1a1c21;--text:#f5f7fa;--muted:#9ba3af;--accent:#39a9ff;--border:#292d35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:16px}.top{padding:8px 0 18px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}.wide{grid-column:1/-1}.value{font-size:25px;font-weight:700;margin-top:5px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 6px}button.active{border-color:var(--accent)}.states{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}.state.active{border-color:var(--accent)}.notice{margin-top:12px;padding:12px;border-radius:10px;background:#17191e;color:var(--muted);font-size:12px}</style>
</head><body><main><section class="top"><h2>📊 Aviator Analysis</h2><div class="muted">Deterministic historical analytics</div></section>
<section class="grid"><div class="card"><div class="muted">Rounds</div><div id="rounds" class="value">—</div></div><div class="card"><div class="muted">Latest</div><div id="latest" class="value">—</div></div><div class="card"><div class="muted">Regime</div><div id="regime" class="value">—</div></div><div class="card"><div class="muted">Streak</div><div id="streak" class="value">—</div></div><div class="card wide"><div class="muted">Signal</div><div id="signal" class="value">—</div><div id="evidence" class="muted"></div></div></section>
<nav class="nav"><button data-view="analytics" class="active">Analytics</button><button data-view="signal">Signal</button><button data-view="challenge">Challenge</button><button id="refresh">Refresh</button></nav>
<div id="panel" class="notice">Loading analysis…</div><div class="notice">Historical statistics describe observed rounds; they do not guarantee the next game outcome.</div></main>
<script>
const tg=window.Telegram?.WebApp;tg?.expand();let model=null,challengeId=new URLSearchParams(location.search).get("challenge");
async function api(path,options={}){const headers={"content-type":"application/json",...(options.headers||{})};if(tg?.initData)headers["x-telegram-init-data"]=tg.initData;const res=await fetch(path,{...options,headers});const body=await res.json();if(!res.ok)throw new Error(body.error?.message||body.error||"API error");return body.data}
async function refresh(){model=await api("/api/v1/analytics");rounds.textContent=model.analytics.sampleSize;latest.textContent=model.analytics.latestMultiplier==null?"—":model.analytics.latestMultiplier.toFixed(2)+"x";regime.textContent=model.analytics.regime;streak.textContent=model.analytics.currentStreak?model.analytics.currentStreak.length+" "+model.analytics.currentStreak.state:"—";signal.textContent=model.signal.direction+" / "+(model.signal.targetState??"NONE");evidence.textContent="Observed rate "+(model.signal.observedRate*100).toFixed(2)+"% · n="+model.signal.sampleSize+" · "+model.signal.confidence;show("analytics")}
async function loadChallenge(){if(!challengeId){panel.textContent="No challenge selected. Open the Mini App with ?challenge=<challengeId>.";return}const [c,s]=await Promise.all([api("/api/v1/challenges/"+encodeURIComponent(challengeId)),api("/api/v1/challenges/"+encodeURIComponent(challengeId)+"/leaderboard")]);panel.innerHTML="<b>"+c.title+"</b><div>Status: "+c.state+" · Round "+c.currentRound+"/"+c.totalRounds+"</div><div id='states' class='states'>"+["LOW","MID","BASE","HIGH","EXTREME"].map(x=>"<button class='state' data-state='"+x+"'>"+x+"</button>").join("")+"</div><button id='submit'>Submit analysis</button><h3>Leaderboard</h3><div>"+(s.length?s.map((x,i)=>(i+1)+". "+x.participantId+" — "+x.points+" pts").join("<br>"):"No scores yet.")+"</div>";document.querySelectorAll(".state").forEach(b=>b.onclick=()=>{document.querySelectorAll(".state").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedState=b.dataset.state});submit.onclick=async()=>{if(!selectedState){panel.insertAdjacentHTML("beforeend","<div class='notice'>Select a state first.</div>");return}await api("/api/v1/challenges/"+encodeURIComponent(challengeId)+"/predictions",{method:"POST",body:JSON.stringify({challengeId,roundNumber:c.currentRound+1,targetState:selectedState,signalVersion:"1.0.0"})});selectedState=null;await loadChallenge()}}
let selectedState=null;function show(view){if(view==="challenge")return loadChallenge().catch(e=>panel.textContent=e.message);if(view==="signal")panel.textContent=model?"Signal: "+model.signal.direction+". Target: "+(model.signal.targetState??"none")+". Evidence n="+model.signal.sampleSize+".":"Load analytics first.";else panel.textContent="Live analytical snapshot from the versioned API."}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-view]").forEach(x=>x.classList.remove("active"));b.classList.add("active");show(b.dataset.view)});refreshBtn=refresh;refreshButton=document.querySelector("#refresh");refreshButton.onclick=()=>refresh().catch(e=>panel.textContent=e.message);refresh().catch(e=>panel.textContent=e.message);
</script></body></html>
